name: Alert bot
on:
  schedule:
    - cron: "50 4-9 * * 1-5"
    - cron: "20 5-9 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message only"
        type: boolean
        default: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: alerted.json
          key: alerted-${{ github.run_id }}
          restore-keys: alerted-
      - run: pip install yfinance pandas numpy
      - run: python alert_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ONLY: ${{ github.event.inputs.test }}
